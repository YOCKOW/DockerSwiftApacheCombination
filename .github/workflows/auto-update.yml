name: Auto-update
on:
  schedule:
    - cron: "0 0 * * 3"
  workflow_dispatch: {} # Enable to run manually
permissions:
  contents: write
  pull-requests: write
env:
  MAIN_BRANCH: main
  BASE_BRANCH: development
  AUTO_UPDATE_BRANCH_PREFIX: auto-update-
  GIT_REMOTE_NAME: origin
jobs:
  auto-update:
    name: Auto-update
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y git zsh libxml2-utils
      - name: Create Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Generate Environment Variables
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          declare -r jobUUID=$(uuidgen)
          declare -r appUserID="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"

          echo "JOB_UUID=$jobUUID" >>"$GITHUB_ENV"
          echo "JOB_DATE=$(date '+%Y-%m-%d %H:%M:%S%z')" >>"$GITHUB_ENV"
          echo "AUTO_UPDATE_BRANCH=${AUTO_UPDATE_BRANCH_PREFIX}${jobUUID}" >>"$GITHUB_ENV"
          echo "GIT_USER_NAME=${APP_SLUG}[bot]" >>"$GITHUB_ENV"
          echo "GIT_USER_EMAIL=${appUserID}+${APP_SLUG}[bot]@users.noreply.github.com" >>"$GITHUB_ENV"
      - name: Configure git
        run: |
          set -x
          git config --local user.name "${GIT_USER_NAME}"
          git config --local user.email "${GIT_USER_EMAIL}"
      - name: Update dependencies on `${{ env.BASE_BRANCH }}` branch
        id: update-dependencies
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: zsh {0}
        run: |
          set -eu

          declare stalePRs=""
          declare aURL
          declare updateSummary=""
          declare newPRURL=""

          echo '::group::Closing stale PRs...'
          {
            stalePRs="$(gh pr list --state open --search "base:${BASE_BRANCH} head:${AUTO_UPDATE_BRANCH_PREFIX}" --json url --jq '.[].url')"

            for aURL in ${(f)stalePRs}; do
              echo "::notice::Closing stale PR: ${aURL}"
              gh pr close "$aURL" --delete-branch
            done
          }
          echo '::endgroup::'

          echo '::group::Fetching upstream...'
          {
            git fetch "${GIT_REMOTE_NAME}" "${MAIN_BRANCH}"
            git fetch "${GIT_REMOTE_NAME}" "${BASE_BRANCH}"
            git checkout "${GIT_REMOTE_NAME}/${BASE_BRANCH}"
            git checkout -b "${AUTO_UPDATE_BRANCH}"
            git merge "${GIT_REMOTE_NAME}/${MAIN_BRANCH}"
          }
          echo '::endgroup::'

          echo '::group::Updating dependencies...'
          {
            ./tools/update-all-dependencies --commit
          }
          echo '::endgroup::'

          echo '::group::Checking diff...'
          {
            updateSummary=$(git diff --shortstat "${GIT_REMOTE_NAME}/${BASE_BRANCH}..HEAD")

            if [[ -z "$updateSummary" ]]; then
              echo "::notice::'${GIT_REMOTE_NAME}/${BASE_BRANCH}' is up-to-date."
              exit 0
            fi
          }
          echo '::endgroup::'

          echo '::group::Opening a new PR...'
          {
            git push --set-upstream "${GIT_REMOTE_NAME}" "${AUTO_UPDATE_BRANCH}:${AUTO_UPDATE_BRANCH}"

            declare -r prTitle="Update dependencies. (${JOB_DATE})"
            declare -r prBody="This PR was created automatically."$'\n\n'"$updateSummary"$'\n\n'"- Job UUID: ${JOB_UUID}"$'\n'"- Date: ${JOB_DATE}"

            newPRURL="$(gh pr create --base "$BASE_BRANCH" --head "$AUTO_UPDATE_BRANCH" --title "$prTitle" --body "$prBody")"

            gh pr edit "$newPRURL" --add-label 'auto-update'

            set +e
            for aURL in ${(f)stalePRs}; do
              gh pr comment "$aURL" --body "New PR: $newPRURL"
            done
            set -e
          }
          echo '::endgroup::'

          echo '::group::Waiting for checks passing...'
          {
            sleep 10
            gh pr checks --watch --fail-fast "$newPRURL"
          }
          echo '::endgroup::'

          echo '::group::Merging PR...'
          {
            declare checksState="UNEXPECTED"
            checksState="$(gh pr checks --json state --jq '.[].state' "$newPRURL" | sort -u | xargs)"

            if ! [[ "${(U)checksState}" =~ ^(SKIPPED[[:space:]]+)?SUCCESS$ ]]; then
              echo "::error::Test(s) Failed. (State: ${checksState})"
              gh pr checks "$newPRURL"
              exit 1
            fi

            gh pr merge --merge --delete-branch "$newPRURL"

            echo "auto-update-pr-url=${newPRURL}" >>"$GITHUB_OUTPUT"
            echo 'updated=true' >>"$GITHUB_OUTPUT"
          }
          echo '::endgroup::'

      - name: Create PR against `${{ env.MAIN_BRANCH }}` branch.
        if: ${{ steps.update-dependencies.outputs.updated == 'true' }}
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AUTO_UPDATE_PR_URL: ${{ steps.update-dependencies.outputs.auto-update-pr-url }}
        shell: zsh {0}
        run: |
          set -eu

          declare currentPRs=""
          currentPRs="$(gh pr list --state open --search "base:${MAIN_BRANCH} head:${BASE_BRANCH}" --json url --jq '.[].url')"

          declare -r numberOfCurrentPRs=$(( 0 + $( echo "$currentPRs" | wc -l ) ))
          declare activePR="$currentPRs"

          if [[ $numberOfCurrentPRs -gt 1 ]]; then
            echo "::error::Unexpected number of current PRs?!"
            exit 1
          elif [[ $numberOfCurrentPRs -eq 0 ]]; then
            declare -r prTitle="Update \`${MAIN_BRANCH}\` branch. (${JOB_DATE})"
            declare -r prBody="This PR was created automatically."$'\n'"Update \`${MAIN_BRANCH}\` branch on a regular basis."$'\n\n'"- Job UUID: ${JOB_UUID}"$'\n'"- Date: ${JOB_DATE}"
            activePR="$(gh pr create --base "$MAIN_BRANCH" --head "$BASE_BRANCH" --title "$prTitle" --body "$prBody")"
          fi

          gh pr edit "$activePR" \
            --add-assignee "${REPOSITORY_OWNER}" \
            --add-reviewer "${REPOSITORY_OWNER}"

          declare -r commentBody='@'"${REPOSITORY_OWNER}"$'\n\n'"\`${BASE_BRANCH}\` branch has been updated via ${AUTO_UPDATE_PR_URL} by bot."
          gh pr comment "$activePR" --body "$commentBody"
