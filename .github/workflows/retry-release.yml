name: Retry release
on:
  workflow_run:
    workflows:
      - "Build/Test/Push(if necessary)"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      workflow-id:
        description: The workflow ID to rerun.
        required: true
jobs:
  retry-release:
    name: Retry release
    runs-on: ubuntu-latest
    if: >-
      ${{
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.run_attempt < 4
        ) ||
        github.event_name == 'workflow_dispatch'
      }}
    steps:
      - name: Generate Environment Variables
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          case "$EVENT_NAME" in
          workflow_run)
            echo "WORKFLOW_ID=${{ github.event.workflow_run.id }}" >>"$GITHUB_ENV"
          ;;
          workflow_dispatch)
            echo "WORKFLOW_ID=${{ inputs.workflow-id }}" >>"$GITHUB_ENV"
          ;;
          *)
            echo "::error::Unexpected event name?!"
            exit 1
          ;;
          esac
      - name: Create Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Rerun the failed job(s).
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh run rerun "${WORKFLOW_ID}" --failed
